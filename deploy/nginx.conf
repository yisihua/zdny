# 育种智能体前端 Nginx 部署示例（HTTP）
# 对应开发态 Vite 代理：
#   /api       → http://10.202.210.30:32860
#   /v1        → http://10.202.210.30:8772   （含 SSE /agent-runs）
#   /geoserver → http://10.202.210.30:32860
#
# 用法：
#   1. npm run build
#   2. 将 dist/ 拷到下方 root 目录
#   3. 按需改 listen / server_name / upstream / root / GeoServer 账号
#   4. nginx -t && nginx -s reload

upstream breedmind_api {
    server 10.202.210.30:32860;
    keepalive 32;
}

upstream breedmind_llm {
    server 10.202.210.30:8772;
    keepalive 16;
}

# 可选：产物源站（工作流 outs 导入，一般不经本站代理；如需同源可解开下方 location）
# upstream breedmind_artifacts {
#     server 10.202.210.30:32862;
# }

server {
    listen 80;
    server_name _;

    # 与后端 100GiB 上传上限对齐；若前面还有一层网关，需同步调大
    client_max_body_size 110g;
    client_body_timeout 3600s;

    # 前端静态资源（npm run build 产物）
    root /var/www/zdny/dist;
    index index.html;

    # 前端使用 hash 路由，静态资源 404 回 index 即可
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 业务后端 /api ----------
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 勿把浏览器 Origin 原样转给后端，避免跨域误判
        proxy_set_header Origin "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_pass http://breedmind_api;
    }

    # ---------- 大模型 / 工作流 /v1（含 SSE） ----------
    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        # SSE 需要保持长连接
        proxy_set_header Connection "";
        proxy_set_header Cache-Control "no-cache";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 关闭缓冲，保证 agent-runs 等事件流实时下发
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;

        proxy_pass http://breedmind_llm;
    }

    # ---------- GeoServer WMS /geoserver ----------
    # 开发态 Vite 会在代理层注入 Basic Auth；生产请二选一：
    #   A) 解开下方 proxy_set_header Authorization（账号写在配置里）
    #   B) 后端/GeoServer 对内网开放，不在此注入
    location /geoserver/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header Connection "";

        # 按需开启（与 .env.development.local 中 GEOSERVER_USER/PASSWORD 对应）
        # proxy_set_header Authorization "Basic <base64(user:password)>";
        # 生成：echo -n 'admin:breedmind_agent' | base64

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://breedmind_api;
    }

    # 可选：同源代理产物站（默认前端用绝对地址 VITE_ARTIFACT_IMPORT_ORIGIN）
    # location /artifacts-origin/ {
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Connection "";
    #     proxy_pass http://breedmind_artifacts/;
    # }

    # 健康检查（可选）
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
